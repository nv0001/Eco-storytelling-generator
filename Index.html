<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пространственный Сторителлинг | Генератор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: #05050a; --surface: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.08);
  --text: #e6e6f0; --text-muted: #8888a0;
  --accent-1: #ff3b5c; --accent-2: #00d4ff; --accent-3: #a855f7; --accent-4: #f59e0b;
  --radius: 16px; --transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow-x: hidden; }
body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; position: relative; }
#bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.app-container { max-width: 1100px; margin: 0 auto; padding: 40px 20px 100px; position: relative; z-index: 1; }

header { text-align: center; margin-bottom: 40px; }
header h1 {
  font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.8rem); font-weight: 700;
  background: linear-gradient(135deg, #fff 0%, var(--accent-1) 25%, var(--accent-2) 50%, var(--accent-3) 75%, var(--accent-4) 100%);
  background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: gradientShift 8s ease infinite; margin-bottom: 8px; letter-spacing: -0.5px;
}
header p { font-size: 0.95rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; font-weight: 300; }
@keyframes gradientShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

.tabs { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 35px; position: sticky; top: 15px; z-index: 10; padding: 10px; background: rgba(5,5,10,0.8); backdrop-filter: blur(16px); border-radius: 18px; border: 1px solid var(--border); }
.tab-btn { padding: 12px 20px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-muted); font-family: 'Montserrat', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all var(--transition); position: relative; overflow: hidden; }
.tab-btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.2); }
.tab-btn.active { color: #fff; border-color: transparent; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
.tab-btn.active[data-task="1"] { background: linear-gradient(135deg, var(--accent-1), #ff6b6b); }
.tab-btn.active[data-task="2"] { background: linear-gradient(135deg, var(--accent-2), #00a8ff); }
.tab-btn.active[data-task="3"] { background: linear-gradient(135deg, var(--accent-3), #7e22ce); }
.tab-btn.active[data-task="4"] { background: linear-gradient(135deg, var(--accent-4), #d97706); color: #05050a; }

.task-panel { display: none; opacity: 0; transform: translateY(15px); }
.task-panel.active { display: block; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 30px; backdrop-filter: blur(12px); position: relative; overflow: hidden; transition: transform 0.2s ease; }
.card::before { content: ''; position: absolute; inset: 0; border-radius: 22px; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.06) 0%, transparent 35%); pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.card:hover::before { opacity: 1; }

.card h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 15px; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
.task-panel:nth-child(1) h2 { color: var(--accent-1); border-color: var(--accent-1); }
.task-panel:nth-child(2) h2 { color: var(--accent-2); border-color: var(--accent-2); }
.task-panel:nth-child(3) h2 { color: var(--accent-3); border-color: var(--accent-3); }
.task-panel:nth-child(4) h2 { color: var(--accent-4); border-color: var(--accent-4); }

.instruction { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 16px; margin-bottom: 20px; border-left: 4px solid; font-size: 0.9rem; line-height: 1.65; }
.task-panel:nth-child(1) .instruction { border-left-color: var(--accent-1); }
.task-panel:nth-child(2) .instruction { border-left-color: var(--accent-2); }
.task-panel:nth-child(3) .instruction { border-left-color: var(--accent-3); }
.task-panel:nth-child(4) .instruction { border-left-color: var(--accent-4); }
.instruction strong { color: #fff; }

.roll-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; border: none; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.3s; color: #fff; margin-bottom: 20px; position: relative; overflow: hidden; }
.roll-btn span { position: relative; z-index: 2; }
.roll-btn::after { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; background: rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%,-50%); transition: width 0.5s, height 0.5s; }
.roll-btn:hover::after { width: 300px; height: 300px; }
.roll-btn:hover:not(:disabled) { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
.roll-btn:disabled { opacity: 0.6; cursor: not-allowed; filter: grayscale(0.5); transform: none !important; box-shadow: none !important; }
.task-panel:nth-child(1) .roll-btn { background: linear-gradient(135deg, var(--accent-1), #ff6b6b); }
.task-panel:nth-child(2) .roll-btn { background: linear-gradient(135deg, var(--accent-2), #00a8ff); }
.task-panel:nth-child(3) .roll-btn { background: linear-gradient(135deg, var(--accent-3), #7e22ce); }
.task-panel:nth-child(4) .roll-btn { background: linear-gradient(135deg, var(--accent-4), #d97706); color: #05050a; }

.display-area { background: rgba(0,0,0,0.25); border-radius: 14px; padding: 25px; min-height: 200px; border: 1px solid var(--border); position: relative; overflow: hidden; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.7; color: var(--text-muted); }
.display-area::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(255,255,255,0.025) 29px, rgba(255,255,255,0.025) 30px); pointer-events: none; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 160px; color: var(--text-muted); opacity: 0.6; }
.task-content { animation: fadeInUp 0.6s ease-out; }
.task-content h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: #fff; margin-bottom: 12px; }
.task-content .meta { margin-bottom: 12px; font-weight: 600; color: var(--text); }
.task-content .text-block { margin-top: 15px; padding: 14px 18px; background: rgba(255,255,255,0.03); border-radius: 10px; border-left: 3px solid; }
.task-panel:nth-child(1) .task-content .text-block { border-left-color: var(--accent-1); }
.task-panel:nth-child(2) .task-content .text-block { border-left-color: var(--accent-2); }
.task-panel:nth-child(3) .task-content .text-block { border-left-color: var(--accent-3); }
.task-panel:nth-child(4) .task-content .text-block { border-left-color: var(--accent-4); }

.status-bar { margin-top: 10px; padding: 8px 12px; text-align: center; font-size: 0.8rem; font-weight: 600; border-radius: 6px; display: none; background: rgba(255,255,255,0.05); border: 1px solid var(--border); }
.status-bar.full { color: var(--accent-4); border-color: var(--accent-4); }
.status-bar.assigned { color: #4ecdc4; border-color: #4ecdc4; }

.counter { margin-top: 10px; text-align: center; font-size: 0.75rem; color: var(--text-muted); opacity: 0.6; }

.admin-panel { margin-top: 60px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px dashed var(--border); }
.admin-panel h3 { font-size: 1rem; color: var(--text-muted); margin-bottom: 10px; }
.admin-row { display: flex; gap: 10px; flex-wrap: wrap; }
.admin-row input { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: #fff; flex: 1; min-width: 150px; outline: none; }
.admin-row button { padding: 10px 20px; border-radius: 8px; border: none; background: #222; color: #fff; cursor: pointer; font-weight: 600; transition: 0.3s; }
.admin-row button:hover { background: #333; }
#pinMsg { margin-top:8px; font-size:0.8rem; color:#4ecdc4; display:none; }

@keyframes fadeInUp { from { opacity:0; transform: translateY(15px) scale(0.98); filter: blur(4px); } to { opacity:1; transform: translateY(0) scale(1); filter: blur(0); } }
@media (max-width: 768px) { .card { padding: 20px 15px; } .tabs { gap: 6px; padding: 8px; } .tab-btn { padding: 8px 12px; font-size: 0.8rem; } .roll-btn { width: 100%; justify-content: center; } }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="app-container">
  <header>
    <h1>Пространственный Сторителлинг</h1>
    <p>Инструменты левел-дизайна и нарратива</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-task="1">🎨 Задание 1</button>
    <button class="tab-btn" data-task="2">🔍 Задание 2</button>
    <button class="tab-btn" data-task="3">🏛️ Задание 3</button>
    <button class="tab-btn" data-task="4">🎲 Задание 4</button>
  </nav>

  <main id="mainContainer">
    <!-- TASKS GENERATED BY JS FOR CONSISTENCY -->
  </main>

  <div class="admin-panel">
    <h3>🔧 Панель преподавателя (сброс генератора)</h3>
    <div class="admin-row">
      <input type="password" id="pinInput" placeholder="Введите PIN-код">
      <button onclick="resetAllWithPin()">Сбросить все задания</button>
    </div>
    <div id="pinMsg"></div>
  </div>
</div>

<script>
// ==================== КОНФИГУРАЦИЯ ====================
const ADMIN_PIN = "1234"; // Измените при необходимости
const SESSION_ID = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substr(2,9);

// ВСТАВЬТЕ СЮДА ДАННЫЕ ИЗ КОНСОЛИ FIREBASE (бесплатно, 2 мин):
const firebaseConfig = {
  apiKey: "ВСТАВЬТЕ_СЮДА",
  authDomain: "ВАШ_ПРОЕКТ.firebaseapp.com",
  projectId: "ВАШ_ПРОЕКТ_ID",
  storageBucket: "ВАШ_ПРОЕКТ.appspot.com",
  messagingSenderId: "ЦИФРЫ",
  appId: "ЦИФРЫ"
};

let db = null;
try {
  if (firebaseConfig.apiKey !== "ВСТАВЬТЕ_СЮДА") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    db.enableNetwork().catch(() => console.warn("Offline mode"));
  }
} catch (e) { console.warn("Firebase init error. Working locally."); }

// ==================== ДАННЫЕ (ТОЧНО ИЗ ДОКУМЕНТОВ) ====================
const tasks = {
  1: [
    { title: '1. Био-Киберпанк', meta: 'Локация: Застекленный балкон-оранжерея в трущобах | Владелец: Опальный генетик корпорации', text: 'Предыстория: Раньше этот человек жил в пентхаусе и создавал элитные органы для богачей. Его уволили со скандалом и лишили лицензии за аморальные эксперименты. Теперь он живет в грязных неоновых трущобах и нелегально выращивает синтетические легкие и печень прямо внутри редких видов орхидей на своем тесном балконе.' },
    { title: '2. Советский Ретрофутуризм', meta: 'Локация: Тесная кухня в коммуналке | Владелец: Свихнувшийся радиоинженер', text: 'Предыстория: На дворе альтернативный 1985 год, СССР колонизирует Марс. Этот инженер работал в секретном НИИ, но его выгнали из-за паранойи. Он уверен, что космонавтами управляют марсианские паразиты. Он превратил свою обшарпанную кухню в пункт радиоперехвата: глушит окна фольгой от облучения и собирает вычислительную машину из кухонной утвари и ворованных радиоламп, схемы марсианских баз на обратной стороне обоев.' },
    { title: '3. Темное фэнтези', meta: 'Локация: Палатка полевого госпиталя | Владелец: Лекарь-некромант', text: 'Предыстория: Идет тяжелая война. В этом госпитале не хватает бинтов и зелий, солдаты умирают сотнями. Главный хирург сломался психически. Чтобы спасать безнадежных раненых, он начал тайно использовать запрещенную магию крови и некромантию. Он пришивает мертвые конечности живым и поддерживает их души с помощью черных ритуалов прямо под носом у инквизиции.' },
    { title: '4. Космоопера', meta: 'Локация: Тесная каюта капитана | Владелец: Контрабандист-романтик', text: 'Предыстория: Этот человек родился в глубоком космосе и никогда не ступал на поверхность Земли. Земля вообще давно уничтожена. Но он одержим культурой «Древней Земли» (особенно Америкой 20-го века), которую знает только по искаженным обрывкам архивов. Он скупает земной антиквариат, часто попадаясь на подделки, и обустраивает каюту звездолета как музей того, чего никогда не видел.' },
    { title: '5. Постапокалипсис', meta: 'Локация: Спортивный зал заброшенной школы | Владелец: Лидер культа «Эффективных»', text: 'Предыстория: Прошло 50 лет после ядерной войны. Группа выживших поселилась в руинах. Их лидер нашел уцелевший сервер с книгами и подкастами по селф-хелпу, тайм-менеджменту и успешному успеху. Не понимая контекста, он возвел это в религию. Школьный спортзал стал храмом, где поклоняются «Богу Продуктивности» и приносят кровавые жертвы тем, кто «прокрастинирует».' }
  ],
  2: [
    { title: '1. Допрос с пристрастием', meta: 'Локация: Квартира на 2 этаже', text: 'Тайная история: Представитель картеля пытал должника, привязав его к стулу пластиковыми стяжками и вырывая ногти пассатижами. Должник сумел освободить одну руку, схватил со стола тяжелую пепельницу, разбил ею голову пытающему. Палач упал на стеклянный журнальный стол. Должник, истекая кровью, перерезал ему горло осколком стекла, после чего выпрыгнул в закрытое окно на козырек подъезда. Тело палача позже забрали «чистильщики» картеля.' },
    { title: '2. Убийство роботом-пылесосом', meta: 'Локация: Закрытая ванная комната', text: 'Тайная история: Жертва — хакер, который принимал ванну. Убийца взломал его систему "Умный дом". Он заблокировал электронный замок двери. Затем направил робота-пылесоса, к которому был примотан оголенный силовой кабель от обогревателя, прямо к краю переполненной ванны. Робот упал в воду, хакера убило током. Его судорогой выгнуло так, что он пробил головой кафель на стене. Вода с кровью вылилась через край. Тело забрала полиция до того, как мы видим план.' },
    { title: '3. Корпоративный яд', meta: 'Локация: Кабинет топ-менеджера', text: 'Тайная история: Босс пил элитный виски с партнером. Партнер подмешал ему в стакан синтетический нейротоксин, который вызывает мгновенное кровоизлияние из всех пор и галлюцинации. Босс начал задыхаться, у него из глаз и носа хлынула кровь. В бреду он пытался застрелить партнера из пистолета, который достал из ящика стола, но промахнулся, прострелил аквариум с дорогими рыбами, упал и захлебнулся собственной кровью и водой. Партнер спокойно забрал пистолет, вытер свой стакан и ушел.' },
    { title: '4. Провальный оккультный призыв', meta: 'Локация: Комната в студенческом общежитии', text: 'Тайная история: Два студента чертили пентаграмму, чтобы приворожить девушку, но ошиблись в символах. Вместо духа любви из портала (открывшегося прямо в шкафу) вылезла многорукая безногая тварь, исторгающая серный смрад и покрытая черной слизью. Она мгновенно оторвала первому студенту голову. Второй студент пытался отбиться электрогитарой, но тварь разорвала его пополам на кровати, забрызгав все плакаты на стене, после чего сожрала оба тела целиком (поэтому их нет на плане) и уползла обратно в шкаф, который захлопнула за собой.' },
    { title: '5. Засада в библиотеке', meta: 'Локация: Архивный зал', text: 'Тайная история: Частный детектив искал компромат в архиве. Наемный убийца поджидал его на верхнем ярусе стеллажей. Когда детектив подошел, киллер спрыгнул на него сверху с мачете. Детектив успел подставить тяжелую энциклопедию, которую мачете прорубило насквозь. Завязалась борьба: детектив выколол киллеру глаз шариковой ручкой, но киллер вслепую разрубил ему бедренную артерию. Детектив полз между стеллажами, скидывая за собой книги, чтобы задержать убийцу, но истек кровью в тупике. Киллер забрал труп, чтобы не оставлять улик.' },
    { title: '6. Бунт плотоядной флоры', meta: 'Локация: Лаборатория ботаники', text: 'Тайная история: Профессор пытался скрестить росянку с ДНК пиявки. Образец вырвался из инкубатора ночью. Когда профессор зашел утром, растение-мутант сбросилось на него с потолочной лампы. Оно обвило его шею лозами с шипами, впрыснуло парализующий яд и выкачало из него всю кровь. В агонии профессор пытался дотянуться до пожарного топора на стене, но лишь разбил стекло пожарного щитка, сорвав ногти. Растение утащило обескровленное тело в вентиляцию.' }
  ],
  3: [
    { title: 'История 1. Разочаровавшийся паладин', meta: 'Локация: Небольшой придорожный каменный алтарь на старом тракте', text: 'Когда-то этот человек был образцовым паладином ордена Света. Он происходил из бедной семьи, с детства верил в справедливость, в священный долг и в то, что добро можно защитить мечом. Орден дал ему смысл, статус, братьев по оружию и простую картину мира: светлое и темное, чистое и нечистое, свои и чужие. Он был искренним, дисциплинированным и даже немного наивным фанатиком — не жестоким по природе, а именно убежденным. Для него придорожные алтари были не просто культовыми точками, а реальными местами встречи с божественным порядком мира.\n\nПотом началась война. На этой войне он увидел не героизм, а административное, рутинное зло, совершаемое теми, кому он молился. Он был свидетелем того, как под знаменем Света сжигали мирных жителей, как инквизиторы пытали детей ради признаний, как жрецы оправдывали любую бойню высокой необходимостью. Он вернулся не только израненным, но и разрушенным изнутри. Его вера не исчезла мгновенно — сначала она стала оправдываться, потом трескаться, потом униженно просить у мира хоть какого-то объяснения.\n\nТеперь это человек, который когда-то умел молиться, а сейчас не уверен, умеет ли вообще во что-то верить. Он пьет, ночует где придется, берет грязную работу, иногда еще автоматически повторяет старые ритуалы — но уже почти как суеверие. В глубине души он одновременно ненавидит орден, скучает по ясности прежней жизни и боится признать, что вся его святость могла быть обслуживанием мясорубки. Пространство алтаря должно прожить вместе с ним путь от сакральности к травме, а потом к окончательному осквернению и присвоению.' },
    { title: 'История 2. Безумный ученый', meta: 'Локация: Подвальная лаборатория в старом викторианском доме', text: 'Этот человек не был прирожденным чудовищем. Наоборот, в молодости он считался мягким, сосредоточенным, блестяще образованным исследователем, скорее неловким в быту, чем опасным. Он искренне любил свою жену — не как красивую музу, а как единственного человека, рядом с которым переставал чувствовать собственную отчужденность. Когда она смертельно заболела редкой и мучительной болезнью, он отказался принять приговор. Сначала он действовал как настоящий ученый: систематизировал симптомы, собирал препараты, выписывал статьи, переписывался с коллегами, ставил аккуратные опыты. Его лаборатория была пространством надежды, дисциплины и любви, пусть уже немного отчаянной.\n\nПосле ее смерти все сломалось не в один день, а в несколько стадий. Сначала он просто не смог организовать похороны. Потом начал разговаривать с телом. Потом убедил себя, что наука не провалилась — просто была недостаточно смелой. Подвал постепенно перестал быть лабораторией в классическом смысле слова и начал превращаться в место, где рациональность соседствует с суеверием, электрические схемы — с анатомическими зарисовками, а метод — с одержимостью. Он больше не ищет лекарство; он пытается отменить сам факт смерти.\n\nК финалу это уже не трагический вдовец, а человек, который присвоил себе право перекраивать живую материю. Он похищает людей, экспериментирует на них, собирает органы и ткани, перестал видеть в телах личности. Но внутренне он до сих пор считает себя не маньяком, а любящим мужем, который просто зашел дальше остальных. Самое страшное в нем — не крикливое безумие, а холодная нежность, с которой он объяснил бы любую свою жестокость. Пространство подвала должно сохранить следы всех этих фаз: научной надежды, траурного отрицания и полной моральной деградации.' },
    { title: 'История 3. Выгоревший художник', meta: 'Локация: Просторная студия-лофт с большими окнами', text: 'Когда-то это был один из самых многообещающих молодых художников своего поколения. Он умел превращать личную боль в точное высказывание, был неудобным, живым, резким и потому быстро стал заметным. Первые выставки, гранты, кураторы, интервью, модные журналы — все это пришло слишком быстро. Пространство студии в начале его пути было местом честного труда, страсти, экспериментирования и еще неиспорченного чувства свободы. Он жил бедно, но энергично, мог работать ночами и верил, что искусство действительно может что-то вскрывать в реальности.\n\nПотом успех сделал его заложником собственного образа. От него стали ждать «узнаваемого почерка», повторяемой боли, удобной радикальности и тех самых жестов, которые однажды уже сработали. Он начал воспроизводить себя, устал от себя, возненавидел публику, кураторов и, главное, собственную способность продавать внутреннюю пустоту как высказывание. Вместо поиска появилась самопародия. Вместо работы — бесконечные попытки начать. Вместо риска — тщательно режиссированная небрежность.\n\nТеперь это человек, который продолжает жить внутри пространства художника, но давно не уверен, что еще является им. Он может целыми днями переставлять вещи, пересматривать старые каталоги, принимать гостей и играть роль большого автора, а ночью сидеть в темноте и смотреть на холст, не в состоянии сделать первый мазок. В нем много презрения, стыда, остатков тщеславия и тайного желания исчезнуть, не объясняясь. Его студия должна пройти путь от живого творческого организма к красивой профессиональной декорации, а затем — к пространству внутренней капитуляции.' },
    { title: 'История 4. Гиперопекающая мать', meta: 'Локация: Комната взрослого сына, который уже уехал из дома', text: 'Эта женщина всю жизнь строила свою идентичность вокруг материнства. Не потому, что у нее не было других способностей, а потому, что именно в заботе она чувствовала контроль, необходимость и моральное превосходство. Сын был для нее и любимым ребенком, и главным жизненным проектом, и доказательством собственной нужности. Она знала, что ему есть, во что одеваться, с кем дружить, куда поступать, как спать, как болеть и как восстанавливаться. Любая его автономия переживалась как ошибка, неблагодарность или внешняя угроза.\n\nКогда сын уехал учиться в другой город, внешне она приняла это достойно: звонила, слала посылки, говорила, что гордится. Но внутри началось медленное расслоение. Она продолжила жить так, будто он вот-вот вернется: ничего не меняла в комнате, поддерживала идеальный порядок, стирала вещи, которые никто не носит, покупала новые предметы «на будущее». Постепенно это пространство перестало быть комнатой реального человека и стало святилищем ее собственной потребности в привязанности и контроле.\n\nСо временем забота мутирует в навязчивость. Она заходит туда чаще, чем нужно, перекладывает предметы, читает старые записи, может тайно проверять переписки на старом устройстве, оставшемся дома. Она одновременно любит сына и не дает ему права окончательно отделиться. Комната должна показать не просто отсутствие человека, а то, как чужое пространство колонизируется тревогой, нежностью, виной и страхом пустоты.' },
    { title: 'История 5. Стареющий спортсмен', meta: 'Локация: Домашний тренажерный зал и комната трофеев', text: 'В юности этот человек был настоящей машиной дисциплины. Он вырос из очень бедной среды и пробился в спорт не благодаря красивой истории про талант, а благодаря звериному упрямству. Каждая медаль, каждая фотография, каждый кубок были для него не сувенирами, а доказательствами, что он сумел выйти из унижения и беспомощности. Его спортивная комната когда-то была храмом режима: чистой, функциональной, подчиненной повторению, усилию и контролю над телом.\n\nНо тело стареет быстрее, чем психика успевает это признать. После травмы, которую уже не получилось до конца восстановить, он сначала пытался тренироваться «через не могу», потом стал срывать злость на молодых, потом начал жить ностальгией. Он все еще рассказывает о правильной технике, режиме и ментальной стойкости, но сам давно не соответствует образу, который транслирует. Он застрял между гордостью за прошлое и паническим страхом оказаться никем без спортивной формы.\n\nСейчас это человек, который может одновременно боготворить свои трофеи и ненавидеть их, потому что они напоминают о невозвратности лучшей версии себя. Он то пытается вернуться в форму и героически закупает новое оборудование, то неделями не прикасается к нему. Пространство должно сохранить напряжение между культом силы, физическим распадом, самодисциплиной и унизительной невозможностью снова стать прежним.' },
    { title: 'История 6. Последний наблюдатель', meta: 'Локация: Смотровая палуба на умирающей космической станции', text: 'Этот человек много лет был частью большого экипажа исследовательской станции на орбите безжизненной планеты. Он не герой и не командир, а, скорее, очень надежный, незаметный профессионал: тот тип людей, на которых держится сложная система. Его работа была наблюдать, фиксировать, поддерживать циклы, следить за рутиной, которую никто не замечает, пока она не дает сбой. Смотровая палуба была для него тихим рабочим местом, почти личной часовней порядка, где огромный равнодушный космос казался чем-то созерцаемым, а не враждебным.\n\nПотом станция начала умирать: аварии, перебои, эвакуации, потеря связи, постепенное сокращение экипажа. Кто-то погиб, кто-то улетел, кто-то сошел с ума. Он остался — сперва потому, что был нужен, потом потому, что не успел, а в какой-то момент уже потому, что сам перестал понимать, возможен ли для него внешний мир. Чем дольше он находится один, тем сильнее смешиваются служебная рутина, траур, автоматизм и странная привязанность к станции как к последнему собеседнику.\n\nТеперь это человек, который живет внутри распадающейся инфраструктуры и разговаривает с журналами обслуживания как с дневником. Он может по привычке выполнять бессмысленные процедуры, полировать стекло перед мертвой панорамой, чинить то, что уже не спасет систему. Смотровая палуба должна показать не просто одиночество, а профессиональную идентичность, пережившую всех остальных и утратившую адресата.' }
  ],
  4: [
    { title: 'Мир 1. Биопанк Океан', text: 'После климатической катастрофы суша почти полностью исчезла под водой. Остатки человечества выжили не за счет восстановления прежней цивилизации, а за счет радикального биоинженерного разворота. Люди научились выращивать себе города, инструменты, ткани, оружие и транспорт из живых организмов. Главная основа жизни — гигантские генномодифицированные киты-носители, на спинах которых располагаются поселения, фермы, резервуары воды, инкубаторы и культовые зоны. Каждый такой кит — одновременно территория, транспорт, экосистема и полуживой бог.\n\nВ этом мире нет привычного металла, пластика и электротехники в старом смысле. Любая технология здесь органическая: свет дают биолюминесцентные грибы и медузы, стены выращиваются из кальцинированных коралловых структур, веревки делают из сухожилий морских тварей, а хранилища информации могут быть чем-то вроде колоний памяти, выращенных в нервной ткани. Ремесло, медицина, архитектура и религия здесь почти неразделимы, потому что любое вмешательство в материю — это вмешательство в живое.\n\nСоциально это мир жесткой зависимости от ресурсов тела и воды. Самая большая ценность — не золото и не оружие, а способность выращивать устойчивые органы, перерабатывать соленую воду, лечить тканевые инфекции и поддерживать здоровье кита-носителя. Болезнь здесь всегда и личная, и инфраструктурная: если заболевает кит, гибнет целое поселение. Отсюда особый культ симбиоза, но и огромный потенциал для ужаса — граница между заботой и паразитизмом постоянно размыта.\n\nЭстетически это мир влажный, полупрозрачный, пульсирующий, живой. Здесь все может дышать, выделять слизь, регенерировать, болеть, пахнуть солью и йодом. Даже красивые пространства в таком мире не должны быть стерильными: они скорее напоминают внутренности огромного мирного организма, в которых человек пытается навести свой порядок.' },
    { title: 'Мир 2. Бесконечный отель «Рассвет»', text: 'Это не просто отель, а форма загробного административного существования. Пространство выглядит как советский санаторий позднего застоя: потертые ковровые дорожки, панели из лакированного дерева, пыльные искусственные цветы, мутные зеркала, облезлый мрамор, тяжелые шторы, графики процедур и стенды с пожелтевшими правилами внутреннего распорядка. Но вся эта узнаваемая материальность сломана изнутри: этажи зацикливаются, лестницы приводят не туда, окна выходят в молочный туман, номера могут менять размер, а некоторые коридоры существуют только если идти по ним, не оборачиваясь.\n\nОтель населен постояльцами, которые не всегда понимают, живы они, мертвы или просто забыты. Здесь никто не управляет своей судьбой напрямую — все регулируется системой правил, наказаний и намеков. Главная сила этого места — Горничные: безликие, идеально вежливые фигуры, которые следят за чистотой, дисциплиной и соблюдением необъяснимых предписаний. Они не кричат и не угрожают; они просто приходят и исправляют нарушение так, как будто насилие — часть сервиса.\n\nВ этом мире особенно важны следы проживания. Любая комната хранит отпечаток того, кто в ней застрял: чем человек дорожил, чего стыдился, что прятал, что отрицал. Ужас здесь строится не на чудовище из шкафа, а на том, что пространство ведет себя как бесконечный бюрократический сон, где бытовая мелочь становится моральным приговором. Пятно на простыне, незапертый чемодан, чужая зубная щетка, засохшая мандариновая кожура на тумбочке — все может оказаться уликой против самого жильца.\n\nЭтот мир удобен для пространственного сторителлинга тем, что здесь бытовое и инфернальное неразделимы. Самый страшный объект — не обязательно что-то экзотическое; это может быть стандартная гостиничная тележка, папка с правилами, запасной ключ или графин с водой, который каждое утро оказывается наполненным заново, даже если его разбили ночью.' },
    { title: 'Мир 3. Заводная Инквизиция', text: 'Это город-государство, построенное вокруг идеи священного времени. Центральная религия утверждает, что мир создан Великим Часовщиком, а значит, любое движение шестерни, любой удар маятника и любой правильно отмеренный цикл — это форма молитвы. Отсюда вырастает вся структура общества: время здесь не метафора, а буквально ресурс, валюта, мера статуса и инструмент наказания. Богатые действительно могут покупать себе дополнительные годы, а бедные — терять месяцы жизни из-за штрафов, долгов и просрочек.\n\nАрхитектура города подчинена дисциплине механизма. Башни с циферблатами видны из любой точки, паровые каналы ритмизируют движение кварталов, мастерские часовщиков соседствуют с исповедальнями, а центральные площади работают как гигантские регуляторы общественного ритма. Люди носят персональные хронометры как удостоверение личности и духовного состояния. Любое опоздание, простой, бессмысленное ожидание или слом механизма трактуется не просто как неудобство, а как нравственное разложение.\n\nИнквизиция здесь — это не толпа фанатиков с факелами, а точная административно-техническая машина. Жрецы-хронометристы умеют измерять, изымать и перераспределять время, а еретиками могут стать не только бунтари, но и те, кто живет медленно, хаотично, непродуктивно, «не по расписанию». Пространства этого мира поэтому всегда несут отпечаток контроля: в них важно, что тикает, что синхронизировано, что опечатано, что отмерено и что выбивается из ритма.\n\nВизуально это мир металла, копоти, эмали, заводской бронзы, стеклянных шкал, маркировки, ритуализированной техники и почти церковной торжественности производственного процесса. Здесь особенно интересно работать с конфликтом между официальной упорядоченностью и тем, что время все равно течет, старит, ржавеет, ломает и выводит из строя даже самые совершенные системы.' },
    { title: 'Мир 4. Соларпанк кочевники', text: 'После краха индустриальной цивилизации большая часть мира превратилась в сухие, выжженные территории с редкими островками пригодной жизни. Но это не мир тотального варварства и отчаяния. Выжившие сообщества нашли другой путь: вместо бесконечной гонки за добычей они строят культуру ремонта, повторного использования, солнечной энергии, коллективного управления и уважения к ограниченности ресурсов. Их города не стоят на месте — это кочевые караваны и огромные песчаные корабли с солнечными парусами, которые перемещаются между руинами старого мира.\n\nЖизнь здесь организована вокруг практик бережности. Ничто не выбрасывается окончательно, каждая вещь имеет историю прошлых применений, каждая поверхность хранит следы починок, латок и переизобретений. Технологичность мира не исчезла, но стала тихой, распределенной и ремесленной. Панели, аккумуляторы, фильтры, водосборники, навигационные ткани, тенты, легкие конструкции, теневые сады — все это должно работать не как футуристический фетиш, а как материальная этика выживания без хищничества.\n\nСоциально это мир, где насилие не исчезло как возможность, но стало глубоко нежелательным и культурно подозрительным. Главные ценности — вода, тень, энергия, память и доверие. Многие сообщества ведут архивы предков не в книгах, а в носимых наборах данных: старых флешках, модулях памяти, обрывках карт, вышитых схемах, солнечных кодексах. Поэтому пространство здесь может одновременно быть утилитарным и очень личным: любой отсек корабля, мастерская или семейный уголок обычно связан с коллективной памятью.\n\nЭстетически это мир света, ткани, дерева, легкого металлолома, отполированного песком стекла и обилия рукотворных адаптаций. В нем не должно быть ощущения «высокой технологии, замаскированной под мусор»; наоборот, достоинство этого мира в том, что он честно красив именно как культура заботливого ремонта.' },
    { title: 'Мир 5. Советская Луна 1970', text: 'В этой версии истории космическая гонка не завершилась символической победой, а превратилась в затяжное, дорогое и изнурительное противостояние сверхдержав. На Луне существует постоянная советская колония, построенная как смесь военного объекта, научного института и бруталистского индустриального города. Это мир героического пафоса, хронического дефицита и идеологического контроля. Все здесь подчинено выживанию в экстремальной среде и одновременной необходимости выглядеть победоносно перед центром.\n\nКолония строилась в спешке и из расчета на функциональность, поэтому ее пространства тесные, тяжелые, утилитарные, насыщенные трубами, шлюзами, релейными шкафами, кабелями, инструкциями, аварийными комплектами и следами бесконечного ремонта. Здесь нет места бытовому комфорту в привычном смысле — даже личные зоны всегда выглядят немного временными и казенными. При этом люди остаются людьми: они пытаются обживать эти модули, вешают фотографии, делают самодельные занавески, прячут дефицитные вещи, варят запрещенный алкоголь, переписывают пластинки на бобины.\n\nГлавная психологическая особенность этого мира — сочетание героического официального дискурса и глухой, изматывающей клаустрофобии. Снаружи — черная пустота, внутри — надзор, дефицит, усталость и ощущение, что любая поломка может убить всех сразу. Информация дозируется, техника капризна, бытовая мелочь приобретает политическое значение. Пространство здесь всегда говорит и о технологии, и о пропаганде, и о частной попытке остаться человеком внутри системы.' },
    { title: 'Мир 6. Мафия из сказок', text: 'Это городской мир эпохи сухого закона, но населенный существами из народных сказок, басен и детских страшилок. Волки, ведьмы, феи, мельники, оборотни, заколдованные невесты, говорящие животные, тролли и пряничные вдовы давно урбанизировались и встроились в криминальную экономику большого города. Магия в этом обществе официально запрещена и регулируется так же, как когда-то алкоголь: ее контрабандой возят, подделывают, разбавляют, разливают по подпольным клубам и продают через сеть семейных кланов.\n\nЭто мир, где архаическое и модерное существуют одновременно. Улицы освещены неоном, но заклинания по-прежнему завязывают на волосы, кровь, соль, молоко, иглы и имена. Криминальные семьи строят власть не только на деньгах и оружии, но и на старых клятвах, проклятиях, родословных и контроле над редкими магическими ресурсами. Пространства здесь особенно выразительны, потому что каждый социальный слой прячет свою природу: обычная булочная может быть прикрытием для торговли чарами, джаз-клуб — местом ритуальных сделок, а портновская мастерская — точкой хранения чужих шкур.\n\nПо тону это мир соблазнительный, стильный, опасный и немного гротескный. Очень важно, что его сказочность не детская. Это мир, где метафоры старых сказок материализовались в социальной реальности: голод — это не образ, а хищная экономика; красота — это капитал; голос, имя и обещание — ликвидный актив. Пространственный сторителлинг здесь хорошо работает через предметы двойного назначения, социальные маски и конфликт между витринной респектабельностью и настоящей, очень древней жестокостью.' },
    { title: 'Мир 7. Хакеры сновидений', text: 'В будущем крупнейшей инфраструктурой стал не интернет, а Дримнет — технологически организованное коллективное пространство сна. Люди подключаются к нему ради терапии, обучения, развлечения, допросов, рекламы, отдыха и нелегального обмена воспоминаниями. Внешне это киберпанк, но его главная сеть построена не на серверах как таковых, а на нейрофизиологии, образах, страхах, повторяющихся символах и эксплуатируемой пластичности человеческого сознания.\n\nПрофессия хакера здесь радикально меняется. Такие специалисты не просто взламывают протоколы: они умеют внедряться в чужие сны, переписывать сцепки образов, маскировать следы, подменять травматические воспоминания, вытаскивать секреты из архитектуры кошмара и оставлять вирусы в виде навязчивых символов. Их инструменты — капсулы сна, нейрошлемы, фармакология, психология, семиотика, украденные эмоциональные паттерны и базы чужих сновидческих шаблонов.\n\nГлавная особенность мира в том, что пространство сна подчиняется не физике, а логике подсознания. Это не значит, что там нет правил — наоборот, правила есть, но они ассоциативные. Дверь может открываться только после того, как объект вспомнит детский стыд; коридор может сокращаться от тревоги; мебель может быть собрана из повторяющихся лиц; обычный предмет может оказаться контейнером памяти. Поэтому в этом сеттинге особенно важно мыслить не реалистическим интерьером, а пространством как отпечатком психики, зараженной технологиями.' }

// ==================== LOGIC ====================
function renderTask(num, idx) {
  const data = tasks[num][idx];
  const el = document.getElementById(`display${num}`);
  let html = `<div class="task-content"><h3>${data.title}</h3>`;
  if (data.meta) html += `<div class="meta">${data.meta}</div>`;
  html += `<div class="text-block">${data.text}</div></div>`;
  el.innerHTML = html;
  
  gsap.fromTo(el, { opacity: 0, y: 15, scale: 0.98, filter: 'blur(4px)' }, { opacity: 1, y: 0, scale: 1, filter: 'blur(0)', duration: 0.5, ease: 'power2.out' });
  
  document.getElementById(`btn${num}`).disabled = true;
  document.getElementById(`btn${num}`).innerHTML = `<span>🔒 Задание закреплено</span>`;
  
  const status = document.getElementById(`status${num}`);
  status.style.display = 'block';
  status.className = 'status-bar assigned';
  status.textContent = '✅ Задание закреплено за вашей сессией. Обновите страницу, чтобы увидеть его снова.';
  updateCounter(num);
}

function updateCounter(num) {
  const c = document.getElementById(`counter${num}`);
  if (!c) return;
  c.textContent = `Всего заданий: ${tasks[num].length}`;
}

async function claimTask(num) {
  const localKey = `sst_task${num}`;
  const local = JSON.parse(localStorage.getItem(localKey));
  if (local && local.idx !== null) { renderTask(num, local.idx); return; }
  
  if (!db) {
    // Fallback local mode
    alert("⚠️ Firebase не подключен. Режим локальной демонстрации. Синхронизация между студентами отключена.");
    const rand = Math.floor(Math.random() * tasks[num].length);
    localStorage.setItem(localKey, JSON.stringify({ idx: rand }));
    renderTask(num, rand);
    return;
  }

  const btn = document.getElementById(`btn${num}`);
  btn.disabled = true;
  btn.innerHTML = `<span>⏳ Закрепление...</span>`;

  try {
    const docRef = db.collection("assignments").doc("classroom_v1");
    const res = await db.runTransaction(async (t) => {
      const doc = await t.get(docRef);
      if (!doc.exists) {
        const init = {};
        for(let i=1;i<=4;i++) init[`task${i}`] = { slots: Array(tasks[i].length).fill(null) };
        t.set(docRef, init);
        return { success: false, retry: true };
      }
      const data = doc.data();
      const key = `task${num}`;
      const slots = data[key]?.slots || Array(tasks[num].length).fill(null);
      const freeIdx = slots.findIndex(s => s === null);
      if (freeIdx === -1) return { success: false, full: true };
      const newSlots = [...slots];
      newSlots[freeIdx] = SESSION_ID;
      t.update(docRef, { [`${key}.slots`]: newSlots });
      return { success: true, idx: freeIdx };
    });

    if (res.success) {
      localStorage.setItem(localKey, JSON.stringify({ idx: res.idx }));
      renderTask(num, res.idx);
    } else if (res.full) {
      btn.innerHTML = `<span>📦 Все выданы</span>`;
      btn.style.cursor = "not-allowed";
      const status = document.getElementById(`status${num}`);
      status.style.display = 'block'; status.className = 'status-bar full';
      status.textContent = '🔒 Все задания из этой пачки уже распределены. Ожидается сброс преподавателем.';
    } else if (res.retry) {
      setTimeout(() => claimTask(num), 400);
    }
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.innerHTML = `<span>🎲 Случайный выбор</span>`;
    alert("Ошибка связи. Проверьте интернет.");
  }
}

async function resetAllWithPin() {
  const input = document.getElementById('pinInput').value.trim();
  const msg = document.getElementById('pinMsg');
  msg.style.display = 'block'; msg.textContent = '';
  
  if (input !== ADMIN_PIN) {
    msg.textContent = "❌ Неверный PIN-код"; msg.style.color = "#ff3b5c"; return;
  }
  if (!db) { msg.textContent = "⚠️ Firebase не настроен. Сброс невозможен."; msg.style.color = "#f59e0b"; return; }
  
  msg.textContent = "🔄 Синхронизация сброса..."; msg.style.color = "#4ecdc4";
  try {
    const docRef = db.collection("assignments").doc("classroom_v1");
    const init = {};
    for(let i=1;i<=4;i++) init[`task${i}`] = { slots: Array(tasks[i].length).fill(null) };
    await docRef.set(init, { merge: true });
    localStorage.clear();
    msg.textContent = "✅ Генератор полностью сброшен. Студенты могут забирать задания заново.";
    setTimeout(() => location.reload(), 1500);
  } catch (e) {
    msg.textContent = "❌ Ошибка сброса. Проверьте консоль."; msg.style.color = "#ff3b5c";
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const target = this.dataset.task;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.task-panel').forEach(p => {
      if(p.classList.contains('active')) {
        gsap.to(p, { opacity: 0, y: -10, duration: 0.25, onComplete: () => {
          p.classList.remove('active');
          const next = document.getElementById(`task${target}`);
          next.classList.add('active');
          gsap.fromTo(next, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' });
        }});
      }
    });
  });
});

document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    card.style.setProperty('--mx', `${((e.clientX - rect.left) / rect.width)*100}%`);
    card.style.setProperty('--my', `${((e.clientY - rect.top) / rect.height)*100}%`);
  });
});

// Init
document.addEventListener('DOMContentLoaded', () => {
  gsap.from('.app-container', { opacity: 0, y: 20, duration: 0.7, ease: 'power2.out' });
  // Check local state for all tasks on load
  for(let i=1;i<=4;i++) updateCounter(i);
});

// ==================== CANVAS BG ====================
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let w, h, particles = [];
const colors = ['#ff3b5c', '#00d4ff', '#a855f7', '#f59e0b', '#ffffff'];
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
class Particle {
  constructor() { this.reset(); this.x = Math.random() * w; this.y = Math.random() * h; }
  reset() { this.x = Math.random() * w; this.y = h + Math.random() * 50; this.size = Math.random() * 2.5 + 1; this.speed = Math.random() * 0.4 + 0.15; this.color = colors[Math.floor(Math.random() * colors.length)]; this.alpha = Math.random() * 0.3 + 0.05; this.drift = (Math.random() - 0.5) * 0.4; }
  update() { this.y -= this.speed; this.x += this.drift + Math.sin(this.y * 0.004) * 0.2; if (this.y < -10) this.reset(); }
  draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.globalAlpha = this.alpha; ctx.fill(); }
}
for(let i=0; i<50; i++) particles.push(new Particle());
function animate() { ctx.clearRect(0,0,w,h); const grd = ctx.createRadialGradient(w*0.5, h*0.5, 0, w*0.5, h*0.5, w*0.8); grd.addColorStop(0, 'rgba(15,15,35,1)'); grd.addColorStop(1, 'rgba(5,5,10,1)'); ctx.fillStyle = grd; ctx.fillRect(0,0,w,h); particles.forEach(p => { p.update(); p.draw(); }); ctx.globalAlpha = 1; requestAnimationFrame(animate); }
animate();
</script>
